name: CI/CD- HyperAutomation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testes:
    name: Testes e validações
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r Avaliacao_02/processo_automatizado/requirements.txt

      - name: Executar testes
        run: |
          python -m pytest Avaliacao_02/processo_automatizado/tests -v