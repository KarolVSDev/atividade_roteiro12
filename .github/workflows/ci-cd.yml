name: CI/CD- HyperAutomation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testes:
    name: Testes e validações
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r Avaliacao_02/processo_automatizado/requirements.txt

      - name: Executar testes
        env:
          PYTHONPATH: Avaliacao_02/processo_automatizado
        run: |
          python -m pytest Avaliacao_02/processo_automatizado/tests -v

  build-and-push:
    name: Build e publicação no GHCR
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Construir imagem Docker
        working-directory: Avaliacao_02/processo_automatizado
        run: |
          docker build -t $IMAGE_NAME:latest .

      - name: Publicar imagem no GHCR
        run: |
          docker push $IMAGE_NAME:latest
