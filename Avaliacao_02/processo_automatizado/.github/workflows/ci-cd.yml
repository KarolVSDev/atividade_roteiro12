name: CI/CD - Hyperautomation

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - develop
      - main

jobs:

  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          pytest


  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build -t hyperautomation .