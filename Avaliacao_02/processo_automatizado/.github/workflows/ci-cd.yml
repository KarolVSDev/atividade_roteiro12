name: CI/CD - HyperAutomation

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main
      - develop

jobs:
  # ============================================================
  # CI - INTEGRAÇÃO CONTÍNUA
  # ============================================================
  testes:
    name: Testes e validações
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe
        run: |
          python -m compileall .

      - name: Executar testes
        run: |
          python -m pytest -v

  # ============================================================
  # CD - ENTREGA CONTÍNUA E PUBLICAÇÃO NO GHCR
  # ============================================================
  publicar:
    name: Build e Publicação no GHCR
    needs: testes
    # Publica a imagem somente quando houver push na branch main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Construir imagem Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Publicar imagem no GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest